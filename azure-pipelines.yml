trigger: none

pool:
  name: default

stages:
- stage: codeScanning
  jobs:
  - job: CodeScanning

  - job: TerraformInit
    dependsOn: CodeScanning
    condition: succeeded()
    steps:
    - checkout: self

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
        backendAzureRmStorageAccountName: 'niteshstg25'
        backendAzureRmContainerName: 'nitu'
        backendAzureRmKey: 'terraform.tfstate'

  - job: TerraformPlan
    dependsOn: TerraformInit
    condition: succeeded()
    steps:
    - checkout: self

    - task: TerraformTask@5
      displayName: Terraform Init for Plan
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
        backendAzureRmStorageAccountName: 'niteshstg25'
        backendAzureRmContainerName: 'nitu'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'

  - job: TerraformApply
    dependsOn: TerraformPlan
    condition: succeeded()
    steps:
    - checkout: self
    - task: TerraformTask@5
      displayName: Terraform Init for Apply
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        backendServiceArm: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'
        backendAzureRmStorageAccountName: 'niteshstg25'
        backendAzureRmContainerName: 'nitu'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
        environmentServiceNameAzureRM: 'Pay-As-You-Go (36acc020-70d9-4256-b01b-f8395250115f)'


